<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B7D45}a:hover{color:#075E33}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F2; font-family: 'Geist', system-ui, sans-serif; color: #0B1210; overflow: hidden">
  <div style="padding: 56px 20px 34px; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; align-items: center; gap: 4px; height: 44px">
      <a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #0B1210">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <span style="font-size: 20px; font-weight: 600; letter-spacing: -0.4px">Settings</span>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E3E6E0">
      <div style="width: 52px; height: 52px; border-radius: 26px; background: #0B1210; color: #D4F56A; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600">A</div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-size: 16px; font-weight: 600">[Your name]</span>
        <span style="font-size: 13px; color: #5F6964">Google · [you@gmail.com]</span>
      </div>
      <button style="height: 36px; padding: 0 12px; border: 1px solid #D3D8D1; border-radius: 10px; background: #FFFFFF; color: #0B1210; font-size: 13px; font-weight: 600; cursor: pointer">Manage</button>
    </div>

    <a href="Paywall.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; background: #0B1210; color: #FFFFFF; text-decoration: none; position: relative; overflow: hidden">
      <div style="position: absolute; right: -30px; top: -50px; width: 150px; height: 150px; border-radius: 75px; background: radial-gradient(circle, rgba(212,245,106,0.25) 0%, rgba(212,245,106,0) 70%)"></div>
      <div style="width: 40px; height: 40px; border-radius: 12px; background: #D4F56A; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B1210" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8-4.3-4.1 5.9-.9z"></path></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 600">Upgrade to Pro</span>
        <span style="font-size: 13px; color: #AEB8B2">2 of 3 free sheets used</span>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </a>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 500; color: #4A5550; padding-left: 4px">Scanning</span>
      <div style="border-radius: 18px; background: #FFFFFF; border: 1px solid #E3E6E0; padding: 0 14px">
        <div style="display: flex; align-items: center; height: 54px; border-bottom: 1px solid #EEF0EB"><span style="flex: 1; font-size: 15px">Beep on scan</span><span role="switch" aria-checked="true" aria-label="Beep on scan" style="width: 50px; height: 30px; box-sizing: border-box; padding: 3px; border-radius: 15px; background: #0B7D45; display: flex; justify-content: flex-end"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span></div>
        <div style="display: flex; align-items: center; height: 54px; border-bottom: 1px solid #EEF0EB"><span style="flex: 1; font-size: 15px">Vibrate on scan</span><span role="switch" aria-checked="true" aria-label="Vibrate on scan" style="width: 50px; height: 30px; box-sizing: border-box; padding: 3px; border-radius: 15px; background: #0B7D45; display: flex; justify-content: flex-end"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span></div>
        <div style="display: flex; align-items: center; height: 54px"><span style="flex: 1; font-size: 15px">Torch on when scanner opens</span><span role="switch" aria-checked="false" aria-label="Torch on when scanner opens" style="width: 50px; height: 30px; box-sizing: border-box; padding: 3px; border-radius: 15px; background: #C9CFC6; display: flex; justify-content: flex-start"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span></span></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 500; color: #4A5550; padding-left: 4px">Sync</span>
      <div style="border-radius: 18px; background: #FFFFFF; border: 1px solid #E3E6E0; padding: 0 14px">
        <div style="display: flex; align-items: center; gap: 10px; height: 60px">
          <span style="width: 8px; height: 8px; border-radius: 4px; background: #D97706"></span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px">3 rows waiting to sync</span><span style="font-size: 12px; color: #5F6964">Office laptops · last try 4 min ago</span></div>
          <button style="height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: #0B1210; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer">Sync now</button>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 500; color: #4A5550; padding-left: 4px">Appearance</span>
      <div role="radiogroup" aria-label="Theme" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #E9ECE6">
        <button role="radio" aria-checked="true" style="height: 40px; border: 0; border-radius: 10px; background: #FFFFFF; color: #0B1210; font-size: 14px; font-weight: 600; box-shadow: 0 1px 3px rgba(11,18,16,0.12); cursor: pointer">System</button>
        <button role="radio" aria-checked="false" style="height: 40px; border: 0; border-radius: 10px; background: transparent; color: #0B1210; font-size: 14px; font-weight: 500; cursor: pointer">Light</button>
        <button role="radio" aria-checked="false" style="height: 40px; border: 0; border-radius: 10px; background: transparent; color: #0B1210; font-size: 14px; font-weight: 500; cursor: pointer">Dark</button>
      </div>
    </div>

    <div style="border-radius: 18px; background: #FFFFFF; border: 1px solid #E3E6E0; padding: 0 14px">
      <a href="#" style="display: flex; align-items: center; height: 52px; border-bottom: 1px solid #EEF0EB; color: #0B1210; text-decoration: none; font-size: 15px"><span style="flex: 1">Rate ScanSheet</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6964" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
      <a href="#" style="display: flex; align-items: center; height: 52px; border-bottom: 1px solid #EEF0EB; color: #0B1210; text-decoration: none; font-size: 15px"><span style="flex: 1">Privacy &amp; terms</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6964" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
      <button style="width: 100%; display: flex; align-items: center; height: 52px; border: 0; background: transparent; padding: 0; color: #B42318; font-size: 15px; text-align: left; cursor: pointer">Clear scan history</button>
    </div>

    <span style="text-align: center; font-size: 12px; color: #5F6964">ScanSheet 1.5.0 · Made by Livin Labs</span>
  </div>
</div>
</x-dc>

</html>
