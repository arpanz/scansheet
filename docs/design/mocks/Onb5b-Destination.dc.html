<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Where rows go</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B7D45}a:hover{color:#075E33}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F2; font-family: 'Geist', system-ui, sans-serif; color: #0B1210; display: flex; flex-direction: column; padding: 56px 24px 34px; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; height: 44px">
    <a href="Onb5-Usecase.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #0B1210">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px">
      <div style="height: 4px; border-radius: 2px; background: #0B1210"></div><div style="height: 4px; border-radius: 2px; background: #0B1210"></div><div style="height: 4px; border-radius: 2px; background: #D9DDD5"></div>
    </div>
    <div style="width: 34px"></div>
  </div>

  <div style="margin-top: 22px; display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 30px; line-height: 1.1; font-weight: 600; letter-spacing: -0.9px">Where should<br>your rows go?</h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #4A5550">Pick a spreadsheet, or start a fresh one. You can switch per sheet later.</p>
  </div>

  <div role="radiogroup" aria-label="Destination" style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
      <div style="border-radius: 18px; border: {{o.border}}; background: #FFFFFF; overflow: hidden">
        <button role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px; border: 0; background: transparent; color: #0B1210; text-align: left; cursor: pointer">
          <div style="width: 38px; height: 38px; border-radius: 11px; background: {{o.iconBg}}; display: flex; align-items: center; justify-content: center; flex: none">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{o.iconFg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"></path></svg>
          </div>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 15px; font-weight: 600">{{o.title}}</span>
              <sc-if value="{{o.rec}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 600; height: 20px; padding: 0 7px; border-radius: 6px; background: #EEF9C8; display: inline-flex; align-items: center">Recommended</span></sc-if>
            </span>
            <span style="font-size: 13px; color: #5F6964">{{o.sub}}</span>
          </span>
          <span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; border: {{o.ring}}; flex: none"></span>
        </button>
        <sc-if value="{{o.showList}}" hint-placeholder-val="{{false}}">
          <div style="padding: 0 14px 14px; display: flex; flex-direction: column; gap: 6px">
            <div style="position: relative">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F6964" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 12px; top: 12px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
              <label for="sheet-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search your spreadsheets</label>
              <input id="sheet-search" placeholder="Search your spreadsheets" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px 0 36px; border-radius: 10px; border: 1px solid #E3E6E0; background: #FAFBF8; font-size: 14px; color: #0B1210; outline: none">
            </div>
            <sc-for list="{{files}}" as="f" hint-placeholder-count="3">
              <button onClick="{{f.pick}}" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 10px; border: 0; border-radius: 10px; background: {{f.bg}}; color: #0B1210; text-align: left; cursor: pointer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B7D45" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 9h8M8 13h8M8 17h5"></path></svg>
                <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 500">{{f.name}}</span><span style="font-size: 12px; color: #5F6964">{{f.meta}}</span></span>
                <sc-if value="{{f.on}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B1210" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
              </button>
            </sc-for>
            <span style="font-size: 12px; color: #5F6964; padding: 4px 2px 0">Rows go into a new tab, so nothing you have is overwritten.</span>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #4A5550">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B7D45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
    ScanSheet only opens the spreadsheets you pick here.
  </div>

  <a href="{{ctaHref}}" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #0B1210; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">{{cta}}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dest: 'new', file: 'stock' };
  }
  renderVals() {
    const dest = this.state.dest;
    const defs = [
      { id: 'new', title: 'Create a new Google Sheet', sub: 'Inventory · 22 Oct, in My Drive › ScanSheet', rec: true, icon: 'M12 5v14M5 12h14' },
      { id: 'existing', title: 'Add to a spreadsheet I have', sub: 'Pick one from your Google Drive', rec: false, icon: 'M4 3h16v18H4zM8 9h8M8 13h8M8 17h5' },
      { id: 'local', title: 'Keep it on this phone', sub: 'Save as Excel or CSV, share when done', rec: false, icon: 'M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM11 18h2' }
    ];
    const opts = defs.map((d) => {
      const on = d.id === dest;
      return {
        ...d,
        on: on ? 'true' : 'false',
        border: on ? '1.5px solid #0B1210' : '1px solid #E3E6E0',
        ring: on ? '7px solid #0B1210' : '1.5px solid #B7BEB9',
        iconBg: on ? '#D4F56A' : '#F0F2EE',
        iconFg: '#0B1210',
        showList: on && d.id === 'existing',
        pick: () => this.setState({ dest: d.id })
      };
    });
    const files = [
      { id: 'stock', name: 'Stock register 2026', meta: 'Edited 2 days ago' },
      { id: 'storeA', name: 'Store A — inventory', meta: 'Edited last week' },
      { id: 'assets', name: 'IT assets', meta: 'Edited in Sept' }
    ].map((f) => {
      const on = f.id === this.state.file;
      return { ...f, on, bg: on ? '#F0F2EE' : 'transparent', pick: () => this.setState({ file: f.id }) };
    });
    const ctas = { new: 'Continue with Google', existing: 'Continue with Google', local: 'Continue offline' };
    return { opts, files, cta: ctas[dest], ctaHref: dest === 'local' ? 'Onb6-Camera.dc.html' : 'Onb4-Signin.dc.html' };
  }
}
</script>
</body>
</html>
