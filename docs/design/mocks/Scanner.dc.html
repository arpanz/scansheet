<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live scanner</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D4F56A}a:hover{color:#E6FA9E}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0F0D; font-family: 'Geist', system-ui, sans-serif; color: #FFFFFF; position: relative; overflow: hidden">
  <div style="position: absolute; inset: 0; background: radial-gradient(90% 55% at 50% 34%, #35403A 0%, #161C19 55%, #0B0F0D 100%)"></div>
  <div style="position: absolute; left: -40px; top: 140px; width: 160px; height: 300px; border-radius: 20px; background: #1E2622; opacity: 0.7"></div>
  <div style="position: absolute; right: -30px; top: 110px; width: 140px; height: 340px; border-radius: 20px; background: #1A211D; opacity: 0.8"></div>
  <div style="position: absolute; left: 100px; top: 232px; width: 190px; height: 118px; border-radius: 10px; background: #E9EDE6; transform: rotate(-3deg); box-shadow: 0 20px 40px rgba(0,0,0,0.4); padding: 16px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; gap: 2px; height: 62px">
      <div style="width: 3px; background: #111"></div><div style="width: 1px; background: #111"></div><div style="width: 4px; background: #111"></div><div style="width: 2px; background: #111"></div><div style="width: 1px; background: #111"></div><div style="width: 3px; background: #111"></div><div style="width: 2px; background: #111"></div><div style="width: 4px; background: #111"></div><div style="width: 1px; background: #111"></div><div style="width: 3px; background: #111"></div><div style="width: 2px; background: #111"></div><div style="width: 1px; background: #111"></div><div style="width: 4px; background: #111"></div><div style="width: 2px; background: #111"></div><div style="width: 3px; background: #111"></div><div style="width: 1px; background: #111"></div><div style="width: 2px; background: #111"></div><div style="width: 4px; background: #111"></div><div style="width: 1px; background: #111"></div><div style="width: 3px; background: #111"></div><div style="width: 2px; background: #111"></div><div style="width: 1px; background: #111"></div><div style="width: 4px; background: #111"></div><div style="width: 2px; background: #111"></div><div style="width: 3px; background: #111"></div>
    </div>
    <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #222; letter-spacing: 2px">8 901234 567890</span>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 56px; padding: 0 16px; display: flex; align-items: center; gap: 8px">
    <a href="Home.dc.html" aria-label="Close scanner" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.14); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </a>
    <a href="SheetView.dc.html" style="flex: 1; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.14); color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600">
      <span style="width: 7px; height: 7px; border-radius: 4px; background: #D4F56A"></span>Warehouse audit
      <span style="font-family: 'Geist Mono', monospace; font-weight: 500; color: #C9D2CC">129</span>
    </a>
    <button aria-label="Torch" aria-pressed="{{torchOn}}" onClick="{{toggleTorch}}" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: {{torchBg}}; color: {{torchFg}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h8l-1 6H9zM9 8h6v3l-1 2v9h-4v-9l-1-2z"></path></svg>
    </button>
  </div>

  <div role="radiogroup" aria-label="What to read" style="position: absolute; left: 50%; top: 114px; transform: translateX(-50%); display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(11,15,13,0.55)">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
      <button role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: {{m.bg}}; color: {{m.fg}}; font-size: 13px; font-weight: 600; cursor: pointer">{{m.label}}</button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 172px; display: flex; justify-content: center">
    <span role="status" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 6px; border-radius: 18px; background: #D4F56A; color: #0B1210; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(212,245,106,0.35)">
      <span style="width: 24px; height: 24px; border-radius: 12px; background: #0B1210; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#D4F56A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
      {{toast}}
    </span>
  </div>

  <div style="position: absolute; left: 60px; top: 220px; width: 270px; height: 150px; border-radius: 22px; box-shadow: inset 0 0 0 2px rgba(212,245,106,0.85), 0 0 40px 6px rgba(212,245,106,0.25)">
    <div style="position: absolute; left: -2px; top: -2px; width: 34px; height: 34px; border-left: 4px solid #D4F56A; border-top: 4px solid #D4F56A; border-top-left-radius: 22px"></div>
    <div style="position: absolute; right: -2px; top: -2px; width: 34px; height: 34px; border-right: 4px solid #D4F56A; border-top: 4px solid #D4F56A; border-top-right-radius: 22px"></div>
    <div style="position: absolute; left: -2px; bottom: -2px; width: 34px; height: 34px; border-left: 4px solid #D4F56A; border-bottom: 4px solid #D4F56A; border-bottom-left-radius: 22px"></div>
    <div style="position: absolute; right: -2px; bottom: -2px; width: 34px; height: 34px; border-right: 4px solid #D4F56A; border-bottom: 4px solid #D4F56A; border-bottom-right-radius: 22px"></div>
  </div>

  <div role="radiogroup" aria-label="Zoom" style="position: absolute; left: 50%; top: 452px; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(11,15,13,0.55)">
    <sc-for list="{{zooms}}" as="z" hint-placeholder-count="3">
      <button role="radio" aria-checked="{{z.on}}" aria-label="Zoom {{z.label}}" onClick="{{z.pick}}" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: {{z.bg}}; color: {{z.fg}}; font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 600; cursor: pointer">{{z.label}}</button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px 34px; border-radius: 28px 28px 0 0; background: #F5F6F2; color: #0B1210; display: flex; flex-direction: column; gap: 12px">
    <div style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #C9CFC6"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
      <span style="font-size: 13px; font-weight: 600; color: #4A5550">Just scanned</span>
      <button role="switch" aria-checked="{{mergeOn}}" onClick="{{toggleMerge}}" style="height: 32px; padding: 0 10px 0 6px; border: 0; border-radius: 16px; background: {{mergeBg}}; color: #0B1210; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer">
        <span style="width: 32px; height: 20px; box-sizing: border-box; padding: 2px; border-radius: 10px; background: {{mergeTrack}}; display: flex; justify-content: {{mergeJustify}}"><span style="width: 16px; height: 16px; border-radius: 8px; background: #FFFFFF"></span></span>
        Repeats add to Qty
      </button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E3E6E0">
      <div style="width: 44px; height: 44px; border-radius: 12px; background: #EEF9C8; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B1210" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"></path></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Whole wheat biscuits · 800 g</span>
        <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #5F6964">8901234567890 · {{rowLabel}}</span>
      </div>
      <span style="font-family: 'Geist Mono', monospace; font-size: 20px; font-weight: 600">×{{qty}}</span>
      <button aria-label="Undo last scan" style="width: 40px; height: 40px; border: 0; border-radius: 12px; background: #F0F2EE; color: #0B1210; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg>
      </button>
    </div>
    <a href="SheetView.dc.html" style="display: flex; align-items: center; justify-content: space-between; height: 32px; color: #0B1210; text-decoration: none; font-size: 13px">
      <span style="color: #4A5550">Before: <span style="font-family: 'Geist Mono', monospace">4006381333931</span> ×12 · <span style="font-family: 'Geist Mono', monospace">8901030865278</span> ×3</span>
      <span style="font-weight: 600; color: #0B7D45">All 129</span>
    </a>
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="ConfirmScan.dc.html" style="flex: 1; height: 52px; border: 1px solid #D3D8D1; box-sizing: border-box; border-radius: 16px; background: #FFFFFF; color: #0B1210; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"></path></svg>Type code
      </a>
      <a href="Export.dc.html" style="flex: 1; height: 52px; border-radius: 16px; background: #0B1210; color: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">Done for now</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { torch: false, merge: true, zoom: '1×', mode: 'barcode' };
  }
  renderVals() {
    const s = this.state;
    const zooms = ['1×', '2×', '5×'].map((label) => {
      const on = label === s.zoom;
      return { label, on: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#0B1210' : '#FFFFFF', pick: () => this.setState({ zoom: label }) };
    });
    const modes = [{ id: 'barcode', label: 'Barcode' }, { id: 'text', label: 'Read text' }].map((m) => {
      const on = m.id === s.mode;
      return { ...m, on: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#0B1210' : '#FFFFFF', pick: () => this.setState({ mode: m.id }) };
    });
    return {
      zooms, modes,
      torchOn: s.torch ? 'true' : 'false',
      torchBg: s.torch ? '#D4F56A' : 'rgba(255,255,255,0.14)',
      torchFg: s.torch ? '#0B1210' : '#FFFFFF',
      toggleTorch: () => this.setState({ torch: !s.torch }),
      mergeOn: s.merge ? 'true' : 'false',
      mergeBg: s.merge ? '#EEF9C8' : '#E9ECE6',
      mergeTrack: s.merge ? '#0B7D45' : '#B7BEB9',
      mergeJustify: s.merge ? 'flex-end' : 'flex-start',
      toggleMerge: () => this.setState({ merge: !s.merge }),
      qty: s.merge ? 13 : 1,
      rowLabel: s.merge ? 'row 42' : 'row 130',
      toast: s.merge ? 'Same item · Qty now 13' : 'Added · row 130'
    };
  }
}
</script>
</body>
</html>
