<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B7D45}a:hover{color:#075E33}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F6F2; font-family: 'Geist', system-ui, sans-serif; color: #0B1210; position: relative; overflow: hidden">
  <div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
      <span style="font-size: 28px; font-weight: 600; letter-spacing: -0.8px">Library</span>
      <a href="NewSheet.dc.html" aria-label="New sheet" style="width: 44px; height: 44px; border-radius: 14px; background: #0B1210; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </a>
    </div>

    <div role="tablist" aria-label="Library sections" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #E9ECE6">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="height: 40px; border: 0; border-radius: 10px; background: {{t.bg}}; color: #0B1210; font-size: 14px; font-weight: {{t.weight}}; box-shadow: {{t.shadow}}; cursor: pointer">{{t.label}}</button>
      </sc-for>
    </div>

    <div style="position: relative">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5F6964" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 15px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <label for="lib-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search library</label>
      <input id="lib-search" placeholder="{{searchHint}}" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 14px 0 42px; border-radius: 14px; border: 1px solid #E3E6E0; background: #FFFFFF; font-size: 15px; color: #0B1210; outline: none">
    </div>

    <sc-if value="{{showSheets}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; gap: 6px">
          <span style="height: 34px; padding: 0 14px; border-radius: 17px; background: #0B1210; color: #FFFFFF; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center">All · 12</span>
          <span style="height: 34px; padding: 0 14px; border-radius: 17px; background: #FFFFFF; border: 1px solid #E3E6E0; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center">In progress</span>
          <span style="height: 34px; padding: 0 14px; border-radius: 17px; background: #FFFFFF; border: 1px solid #E3E6E0; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center">Needs sync</span>
        </div>
        <sc-for list="{{sheets}}" as="s" hint-placeholder-count="4">
          <a href="SheetView.dc.html" style="display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E3E6E0; color: #0B1210; text-decoration: none">
            <div style="display: flex; align-items: center; gap: 12px">
              <div style="width: 40px; height: 40px; border-radius: 12px; background: {{s.iconBg}}; display: flex; align-items: center; justify-content: center">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{s.iconFg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.icon}}"></path></svg>
              </div>
              <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
                <span style="font-size: 15px; font-weight: 600">{{s.name}}</span>
                <span style="font-size: 12px; color: #5F6964">{{s.meta}}</span>
              </div>
              <span style="font-family: 'Geist Mono', monospace; font-size: 18px; font-weight: 500">{{s.rows}}</span>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid #EEF0EB">
              <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #5F6964">{{s.cols}}</span>
              <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: {{s.statusFg}}"><span style="width: 6px; height: 6px; border-radius: 3px; background: {{s.dot}}"></span>{{s.status}}</span>
            </div>
          </a>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{showScans}}" hint-placeholder-val="{{false}}">
      <div style="border-radius: 18px; background: #FFFFFF; border: 1px solid #E3E6E0; overflow: hidden">
        <sc-for list="{{scans}}" as="q" hint-placeholder-count="6">
          <div style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 68px; border-bottom: 1px solid #EEF0EB">
            <div style="width: 38px; height: 38px; border-radius: 11px; background: #F0F2EE; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B1210" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{q.icon}}"></path></svg>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
              <span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{q.value}}</span>
              <span style="font-size: 12px; color: #5F6964">{{q.type}} · {{q.when}}</span>
            </div>
            <button aria-label="Copy" style="width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: #4A5550; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>
            </button>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 92px; box-sizing: border-box; padding: 10px 28px 26px; background: rgba(245,246,242,0.96); border-top: 1px solid #E3E6E0; display: flex; align-items: center; justify-content: space-between">
    <a href="Home.dc.html" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #5F6964; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home
    </a>
    <a href="ScanChooser.dc.html" aria-label="Scan" style="width: 64px; height: 64px; margin-top: -26px; border-radius: 22px; background: #0B1210; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 24px rgba(11,18,16,0.25)">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#D4F56A" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M7 12h10"></path></svg>
    </a>
    <a href="Library.dc.html" aria-current="page" style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #0B1210; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>Library
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'sheets' };
  }
  renderVals() {
    const tab = this.state.tab;
    const tabs = [
      { id: 'sheets', label: 'Sheets' },
      { id: 'scans', label: 'Code history' }
    ].map((t) => {
      const on = t.id === tab;
      return {
        ...t,
        on: on ? 'true' : 'false',
        bg: on ? '#FFFFFF' : 'transparent',
        weight: on ? '600' : '500',
        shadow: on ? '0 1px 3px rgba(11,18,16,0.12)' : 'none',
        pick: () => this.setState({ tab: t.id })
      };
    });
    const green = { statusFg: '#0B7D45', dot: '#0B7D45' };
    const sheets = [
      { name: 'Warehouse audit', meta: 'Today · Google Sheets', rows: '129', cols: 'Item · Qty · Time · Aisle', status: 'In progress', statusFg: '#0B1210', dot: '#9BC31F', iconBg: '#0B1210', iconFg: '#D4F56A', icon: 'M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8' },
      { name: 'Office laptops', meta: 'Mon · Google Sheets', rows: '58', cols: 'Tag · Location · Status', status: '3 queued', statusFg: '#A15C07', dot: '#D97706', iconBg: '#F0F2EE', iconFg: '#0B1210', icon: 'M20 12l-8 8-8-8V4h8z' },
      { name: 'Diwali meetup check-in', meta: '19 Oct · Google Sheets', rows: '342', cols: 'Ticket · Gate · Time', status: 'Synced', ...green, iconBg: '#F0F2EE', iconFg: '#0B1210', icon: 'M3 9a3 3 0 0 0 0 6v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3a3 3 0 0 1 0-6V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2zM13 4v16' }
    ];
    const scans = [
      { value: 'https://livinlabs.in/menu', type: 'Link', when: '10:14', icon: 'M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1' },
      { value: 'Cafe_Guest', type: 'Wi‑Fi', when: '09:40', icon: 'M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M2 9a15 15 0 0 1 20 0M12 20h.01' },
      { value: '8901030865278', type: 'Product · EAN‑13', when: 'Yesterday', icon: 'M4 6v12M8 6v12M11 6v12M15 6v12M18 6v12M20 6v12' },
      { value: 'Locker 14 — return by Friday', type: 'Text', when: 'Yesterday', icon: 'M4 6h16M4 12h16M4 18h10' },
      { value: '+91 98•• •• 4120', type: 'Phone', when: 'Mon', icon: 'M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z' }
    ];
    return {
      tabs, sheets, scans,
      showSheets: tab === 'sheets',
      showScans: tab === 'scans',
      searchHint: tab === 'sheets' ? 'Search sheets' : 'Search scanned codes'
    };
  }
}
</script>
</body>
</html>
